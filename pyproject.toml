[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-web-scraper"
version = "1.0.0"
description = "Herramienta modular y prudente para inspeccionar y extraer datos web"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "requests>=2.31",
    "selenium>=4.18",
]

[project.optional-dependencies]
playwright = ["playwright>=1.42"]
excel = ["openpyxl>=3.1"]
postgres = ["psycopg[binary]>=3.1"]
mongodb = ["pymongo>=4.6"]
test = ["pytest>=8.0"]
all = [
    "playwright>=1.42",
    "openpyxl>=3.1",
    "psycopg[binary]>=3.1",
    "pymongo>=4.6",
    "pytest>=8.0",
]

[project.scripts]
smart-scraper = "smart_scraper.gui:main"

[tool.setuptools.packages.find]
include = ["smart_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
